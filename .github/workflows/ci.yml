name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flags
          key: flags-${{ hashFiles('flags/versions.yaml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # a rollout replayed on recorded answers: the Gemini 1.5 Flash upgrade that lost 8 points
      - run: python -m flags replay gemini-1.5-flash-001 gemini-1.5-flash-002
